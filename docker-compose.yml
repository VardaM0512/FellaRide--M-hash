services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fellaride
      POSTGRES_USER: ${POSTGRES_USER:-fellaride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fellaride} -d fellaride"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      FELLARIDE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fellaride}:${POSTGRES_PASSWORD}@db:5432/fellaride
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
