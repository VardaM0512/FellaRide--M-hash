# Closes the engine day for every real community once a day (expires unmatched demand, saves the day's metrics).
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   FELLARIDE_API_URL   e.g. https://fellaride-api.onrender.com
#   FELLARIDE_ADMIN_KEY the same value as the API's FELLARIDE_ADMIN_KEY on Render
name: Daily day close
on:
  schedule:
    - cron: "35 18 * * *"   # 00:05 India time
  workflow_dispatch: {}
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the API and close the day
        env:
          API: ${{ secrets.FELLARIDE_API_URL }}
          KEY: ${{ secrets.FELLARIDE_ADMIN_KEY }}
        run: |
          curl -sS --retry 6 --retry-delay 20 --retry-all-errors --max-time 120 "$API/health"
          curl -sS --fail-with-body --retry 3 --retry-delay 20 --max-time 120 \
            -X POST -H "X-Admin-Key: $KEY" "$API/api/v1/cron/close-days"
